# cargo-deny config (https://embarkstudios.github.io/cargo-deny/), run in CI by `cargo deny check`

[advisories]
# the defaults: vulnerabilities, unmaintained and unsound crates fail, yanked crates warn

[licenses]
# Unicode-3.0 comes in through unicode-ident, Zlib through foldhash (via tract), CC0-1.0 through
# tiny-keccak (via rust-ini), and the build dependencies of the PipeWire bindings bring BSD-3-Clause
# (bindgen), ISC (libloading via clang-sys) and Apache-2.0 WITH LLVM-exception (target-lexicon via
# system-deps); every other license in the tree is only an alternative to one of these
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSD-3-Clause",
    "ISC",
    "Apache-2.0 WITH LLVM-exception",
]

[bans]
# several versions of one crate are often unavoidable, so they only warn
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# sonora with the fix that makes its echo canceller allocation-free, see [patch.crates-io] in
# Cargo.toml
allow-git = ["https://github.com/dignifiedquire/sonora"]
