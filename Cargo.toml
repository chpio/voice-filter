[workspace]
members = ["crates/deep-filter-rt"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[package]
name = "voice-filter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Live voice filter for PipeWire: a virtual microphone that removes background noise with DeepFilterNet3 and enhances the voice"
authors = ["Thomas Heck <t@b128.net>"]
license.workspace = true
categories = ["multimedia", "multimedia::audio"]
keywords = ["audio", "pipewire", "noise-suppression", "voice", "microphone"]
include = [
    "/src/**/*",
    "/tests/**/*",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[features]
default = ["gui"]
# the GNOME app (`voice-filter ui`), needs GTK 4 and libadwaita; without it, only the daemon and the
# command line
gui = ["dep:adw", "dep:gtk", "zbus/proxy"]

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"], optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
deep-filter-rt = { path = "crates/deep-filter-rt", version = "0.1" }
# v4_10 for Scale::set_format_value_func
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"], optional = true }
hound = "3.5"
ndarray = "0.17"
# v0_3_49 for Buffer::requested, v0_3_50 for Time::buffered
pipewire = { version = "0.10", features = ["v0_3_50"] }
rtrb = "0.4"
zbus = { version = "6", default-features = false, features = ["default-rt", "service"] }

[dev-dependencies]
tempfile = "3"
