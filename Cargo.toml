[workspace]
members = ["crates/deep-filter-rt"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/chpio/voice-filter"

[package]
name = "voice-filter"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
description = "Live voice filter for PipeWire: a virtual microphone that removes the echo of the speakers and background noise (DeepFilterNet3) and enhances the voice"
authors = ["Thomas Heck <t@b128.net>"]
license.workspace = true
repository.workspace = true
categories = ["multimedia", "multimedia::audio"]
keywords = ["audio", "pipewire", "noise-suppression", "voice", "microphone"]
include = [
    "/src/**/*",
    "/data/**/*",
    "/i18n/**/*",
    "/tests/**/*",
    "/benches/**/*",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[features]
default = ["gui"]
# the GNOME app (`voice-filter ui`), needs GTK 4 and libadwaita; without it, only the daemon and the
# command line
gui = ["dep:adw", "dep:gtk", "dep:serde", "zbus/proxy"]

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"], optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
deep-filter-rt = { path = "crates/deep-filter-rt", version = "0.2" }
# the translations of the app and the tray, embedded (`i18n`)
fluent-bundle = "0.16"
# the version fluent-bundle uses, a newer one would be a second copy
fluent-langneg = "0.13"
# v4_10 for Scale::set_format_value_func
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"], optional = true }
hound = "3.5"
# the icon in the tray (StatusNotifierItem), without tokio; it brings zbus 5 along
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
ndarray = "0.17"
# v0_3_49 for Buffer::requested, v0_3_50 for Time::buffered
pipewire = { version = "0.10", features = ["v0_3_50"] }
rlsf = "0.2"
rtrb = "0.4"
# for the app: the derive of zbus that reads all properties at once expands to serde
serde = { version = "1", optional = true }
# AEC3, the echo canceller of WebRTC, in pure Rust
sonora = "0.3"
unic-langid = "0.9"
zbus = { version = "6", default-features = false, features = ["default-rt", "service"] }

# flushes denormals to zero around the audio processing (`dsp::without_denormals`), only for the
# architectures the crate supports
[target.'cfg(any(target_arch = "x86", target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
no_denormals = "0.3"

# serde is only named by the code the derive macros of zbus expand to
[package.metadata.cargo-machete]
ignored = ["serde"]

[dev-dependencies]
# the spectra of the sidechain example
realfft = "3.1"
tempfile = "3"
# for a test of the app's client over a connection without a bus
zbus = { version = "6", default-features = false, features = ["p2p"] }

# the processing time and the allocations of every stage, `cargo bench --bench stages [-- in.wav]`
[[bench]]
name = "stages"
harness = false

# a panic in any thread stops the whole process: a daemon without its D-Bus thread would go on
# filtering with no way to control it (tests and benches ignore this and unwind)
[profile.release]
panic = "abort"

