[package]
name = "voice-filter-gtk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "GNOME app to control Voice Filter, the live voice filter for PipeWire"
authors = ["Thomas Heck <t@b128.net>"]
license.workspace = true
# an app, installed with the package of voice-filter, not a crate for others
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
gtk = { package = "gtk4", version = "0.11" }
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy"] }
